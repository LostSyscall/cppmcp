name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        build_type: [Debug, Release]

    steps:
      - uses: actions/checkout@v4

      # vcpkg manifest mode + GitHub Actions cache for built dependencies.
      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/vcpkg/archives
            ~/.cache/vcpkg/archives
          key: vcpkg-${{ matrix.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: vcpkg-${{ matrix.os }}-

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: '2025.01.13'

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: >
          cmake -B build
          -DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake
          -DCPPMCP_BUILD_TESTS=ON
          -DCPPMCP_BUILD_INTEGRATION_TESTS=ON
          -DCPPMCP_BUILD_EXAMPLES=ON

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: >
          cmake -B build
          -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCPPMCP_BUILD_TESTS=ON
          -DCPPMCP_BUILD_INTEGRATION_TESTS=ON
          -DCPPMCP_BUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Unit tests
        working-directory: build
        run: ctest -E integration --output-on-failure -C ${{ matrix.build_type }} --timeout 120

      - name: Integration tests
        working-directory: build
        run: ctest -L integration --output-on-failure -C ${{ matrix.build_type }} --timeout 180

  format-check:
    name: clang-format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Non-blocking while the tree is unformatted; flip to --Werror once
      # clang-format has been applied in a dedicated pass.
      - name: Run clang-format (report only)
        run: |
          find include src tests examples -name '*.hpp' -o -name '*.cpp' | \
            xargs clang-format --dry-run 2>&1 | head -50 || true
      - name: Count unformatted files
        run: |
          COUNT=$(find include src tests examples -name '*.hpp' -o -name '*.cpp' | \
            xargs clang-format --dry-run 2>/dev/null | grep -c '^' || true)
          echo "clang-format findings: $COUNT"

  sanitizer:
    name: ubuntu / ASan+UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-ubuntu-asan-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: vcpkg-ubuntu-asan-

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: '2025.01.13'

      - name: Configure (sanitizers)
        run: >
          cmake -B build
          -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer'
          -DCPPMCP_BUILD_TESTS=ON
          -DCPPMCP_BUILD_INTEGRATION_TESTS=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Unit tests (sanitized)
        working-directory: build
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: ctest -E integration --output-on-failure --timeout 300
