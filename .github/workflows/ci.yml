name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        build_type: [Debug, Release]

    steps:
      - uses: actions/checkout@v4

      - name: Setup vcpkg (clone + bootstrap)
        shell: bash
        run: |
          set -e
          if [ "$RUNNER_OS" = "Windows" ]; then
            VCPKG_DIR="$RUNNER_TEMP/vcpkg"
          else
            VCPKG_DIR=/opt/vcpkg
          fi
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_DIR"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cd "$VCPKG_DIR" && cmd //c "bootstrap-vcpkg.bat -disableMetrics"
          else
            "$VCPKG_DIR/bootstrap-vcpkg.sh" -disableMetrics
          fi
          echo "VCPKG_ROOT=$VCPKG_DIR" >> "$GITHUB_ENV"

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/vcpkg/archives
            /opt/vcpkg/archives
          key: vcpkg-bin-${{ matrix.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-bin-${{ matrix.os }}-

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: >
          cmake -B build -A x64
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DCPPMCP_BUILD_TESTS=ON
          -DCPPMCP_BUILD_INTEGRATION_TESTS=ON
          -DCPPMCP_BUILD_EXAMPLES=ON

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: >
          cmake -B build
          -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCPPMCP_BUILD_TESTS=ON
          -DCPPMCP_BUILD_INTEGRATION_TESTS=ON
          -DCPPMCP_BUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Unit tests
        working-directory: build
        shell: bash
        run: |
          set -o pipefail
          ctest -E integration --output-on-failure -C ${{ matrix.build_type }} --timeout 120 2>&1 | tee ctest-unit.log | tail -40
          rc=${PIPESTATUS[0]}
          echo "ctest rc=$rc" >> "$GITHUB_STEP_SUMMARY" || true
          if [ "$rc" -ne 0 ]; then
            {
              echo '## Unit test failures'
              echo '```'
              grep -vE "\*\*\*Not Run|Passed" ctest-unit.log | tail -120
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "ctest-unit-failed"
          fi
          exit "$rc"

      - name: Integration tests
        working-directory: build
        run: ctest -L integration --output-on-failure -C ${{ matrix.build_type }} --timeout 180

  format-check:
    name: clang-format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Report-only while the tree is unformatted; flip to --Werror once a
      # dedicated formatting pass has landed.
      - name: Run clang-format (report only)
        run: |
          COUNT=$(find include src tests examples -name '*.hpp' -o -name '*.cpp' | \
            xargs -r clang-format --dry-run 2>&1 | grep -c '\[warning\]' || true)
          echo "clang-format findings: $COUNT"

  sanitizer:
    name: ubuntu / ASan+UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup vcpkg (clone + bootstrap)
        shell: bash
        run: |
          set -e
          git clone https://github.com/microsoft/vcpkg.git /opt/vcpkg
          /opt/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          echo "VCPKG_ROOT=/opt/vcpkg" >> "$GITHUB_ENV"

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: /opt/vcpkg/archives
          key: vcpkg-bin-ubuntu-asan-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-bin-ubuntu-

      - name: Configure (sanitizers)
        run: >
          cmake -B build
          -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer'
          -DCPPMCP_BUILD_TESTS=ON
          -DCPPMCP_BUILD_INTEGRATION_TESTS=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Unit tests (sanitized)
        working-directory: build
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: ctest -E integration --output-on-failure --timeout 300
